name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Fedora Latest)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            meson \
            ninja-build \
            gcc \
            git \
            desktop-file-utils \
            libappstream-glib \
            appstream \
            gtk4-devel \
            libadwaita-devel \
            glib2-devel \
            cairo-devel \
            sqlite-devel

      - name: Configure Meson
        run: meson setup build -Dwarning_level=2 -Dwerror=true

      - name: Compile
        run: meson compile -C build

      - name: Run Unit & Integration Tests
        run: meson test -C build --verbose

      - name: Validate Desktop File
        run: desktop-file-validate data/org.gnome.Hci.desktop.in

      - name: Validate Appstream Metadata
        run: appstreamcli validate data/org.gnome.Hci.metainfo.xml.in || true

      - name: Validate GSettings Schema
        run: glib-compile-schemas --strict --dry-run data/

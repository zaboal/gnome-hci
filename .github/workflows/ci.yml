name: CI

on:
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Fedora Latest)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc \
            clang \
            meson \
            ninja-build \
            git \
            gtk4-devel \
            libadwaita-devel \
            glib2-devel \
            cairo-devel \
            sqlite-devel \
            desktop-file-utils \
            libappstream-glib \
            appstream \
            gettext

      - name: Configure Meson
        run: meson setup build -Dwarning_level=2 -Dwerror=true

      - name: Compile
        run: meson compile -C build --verbose

      - name: Run Unit & Integration Tests
        run: meson test -C build --verbose

      - name: Validate Desktop File
        run: |
          # desktop-file-validate data/org.gnome.Hci.desktop.in requires .desktop extension; validate compiled build/data output
          desktop-file-validate build/data/org.gnome.Hci.desktop

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate --no-net data/org.gnome.Hci.metainfo.xml.in
          appstreamcli validate --no-net build/data/org.gnome.Hci.metainfo.xml

      - name: Validate GSettings Schema
        run: glib-compile-schemas --strict data/


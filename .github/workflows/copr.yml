name: COPR Packaging & Build

on:
  push:
    branches: [ main, 'ci/**' ]
  workflow_dispatch:

jobs:
  copr-build:
    name: Build SRPM & Submit to COPR
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            copr-cli \
            git \
            tar \
            gzip \
            coreutils

      - name: Prepare build tree & source tarball
        run: |
          rpmdev-setuptree
          VERSION=$(grep -m1 "version:" meson.build | cut -d"'" -f2)
          echo "Building source tarball for version ${VERSION}..."
          git config --global --add safe.directory "*" || true
          if [ -d .git ] && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git archive --format=tar.gz --prefix="gnome-hci-${VERSION}/" -o ~/rpmbuild/SOURCES/gnome-hci-${VERSION}.tar.gz HEAD
          else
            STAGING_DIR=$(mktemp -d)
            mkdir -p "${STAGING_DIR}/gnome-hci-${VERSION}"
            cp -r . "${STAGING_DIR}/gnome-hci-${VERSION}/"
            rm -rf "${STAGING_DIR}/gnome-hci-${VERSION}/.git"
            tar -czf ~/rpmbuild/SOURCES/gnome-hci-${VERSION}.tar.gz -C "${STAGING_DIR}" "gnome-hci-${VERSION}"
            rm -rf "${STAGING_DIR}"
          fi
          cp packaging/gnome-hci.spec ~/rpmbuild/SPECS/

      - name: Build Source RPM (SRPM)
        run: |
          rpmbuild -bs ~/rpmbuild/SPECS/gnome-hci.spec
          ls -lh ~/rpmbuild/SRPMS/

      - name: Upload SRPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-hci-srpm
          path: ~/rpmbuild/SRPMS/*.src.rpm

      - name: Submit SRPM to COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -n "$COPR_CONFIG" ]; then
            echo "COPR_CONFIG secret is configured. Preparing ~/.config/copr..."
            mkdir -p ~/.config
            echo "$COPR_CONFIG" > ~/.config/copr
            chmod 600 ~/.config/copr
            echo "Dispatching cloud build to Fedora COPR (zaboal/t430-optimized)..."
            copr-cli build zaboal/t430-optimized ~/rpmbuild/SRPMS/*.src.rpm --nowait
            echo "COPR build successfully triggered."
          else
            echo "Notice: COPR_CONFIG secret is not configured."
            echo "Skipping Fedora COPR cloud submission while preserving generated SRPM artifact."
          fi
